<!DOCTYPE html>
<!--
  THESIS: 自定义动作（ADR-0029）编辑器的交互方案 —— 时间轴内联展开的关键帧/曲线视图，
  拒绝把关键帧编辑做成独立模态或与场景脱节的散点表单。
  OWN-WORLD: 沿用 AeonStagery 电影制作控制台（Cinematic Noir Workshop）—— 近黑蓝紫表面、
  暖珊瑚焦点、JetBrains Mono 时间/数值、轨道语义色窄轨；曲线编辑区以「对齐标尺」的工作面出现。
  STORY: 作者右键普通动作 → 转为自定义动作 → 时间轴上就地展开曲线，拖动菱形、切换参数、
  编辑分段，全程与播放头、标尺、检查器保持同一时间语义。
  FIRST VIEWPORT: 时间轴角色轨道上一条已展开的自定义动作编辑器 + 一条待转换的普通动作；
  右侧检查器随选择切换「资源动作 / 自定义动作」两种表单。
  FORM: 既有世界的内联扩展（不跑概念竞赛）；seed 不适用。
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->

<style>

:root {

  --bg-primary: #f4f5f7;

  --bg-elevated: #e6e8ec;
  --bg-hover: #f0f1f4;
  --text-primary: #13151a;
  --text-secondary: #4b5160;
  --text-muted: #8c92a0;
  --text-accent: #4f46e5;
  --accent-primary: #4f46e5;
  --accent-secondary: #6366f1;
  --accent-glow: rgba(79, 70, 229, 0.15);
  --accent-hover: #4338ca;
  --border-subtle: rgba(0, 0, 0, 0.04);
  --border-default: rgba(0, 0, 0, 0.07);
  --border-highlight: rgba(0, 0, 0, 0.13);
  --border-accent: rgba(79, 70, 229, 0.3);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.1);

  --app-gradient: linear-gradient(180deg, #f4f5f7 0%, #e8eaef 100%);
}

[data-theme="dark"] {
  --bg-primary: #11131a;
  --bg-secondary: rgba(24, 25, 34, 0.92);
  --bg-tertiary: #191b25;
  --bg-surface: #1d1f2a;
  --bg-elevated: #252735;
  --bg-hover: #2b2d3d;
  --text-primary: #f1eee9;
  --text-secondary: #aaa4b4;
  --text-muted: #706b7a;
  --text-accent: #d88c7a;
  --accent-primary: #d88c7a;

  --shadow-md: 0 6px 18px rgba(4, 5, 10, 0.36);
  --shadow-lg: 0 18px 42px rgba(4, 5, 10, 0.46);
  --shadow-glow: 0 0 24px var(--accent-glow);
  --app-gradient: radial-gradient(circle at 16% 0%, rgba(216, 140, 122, 0.11) 0%, transparent 34%), linear-gradient(180deg, #11131a 0%, #171923 100%);

[data-theme="pink"] {
  --bg-primary: #f6ece6;
  --bg-secondary: rgba(255, 250, 247, 0.88);
  --bg-tertiary: #efe1da;
  --bg-surface: rgba(255, 252, 249, 0.94);
  --bg-elevated: #fff7f2;

  --text-primary: #3f2d29;
  --text-secondary: #7b625a;

  --text-accent: #b86f7b;
  --accent-primary: #cea493;
  --accent-secondary: #ffdade;
  --accent-glow: rgba(255, 218, 222, 0.65);
  --accent-hover: #b88d7d;
  --border-subtle: rgba(146, 104, 92, 0.14);
  --border-default: rgba(146, 104, 92, 0.22);
  --border-highlight: rgba(206, 164, 147, 0.52);
  --border-accent: rgba(206, 164, 147, 0.68);
  --shadow-sm: 0 2px 4px rgba(63, 45, 41, 0.05);
  --shadow-md: 0 6px 16px rgba(63, 45, 41, 0.08);
  --shadow-lg: 0 16px 36px rgba(63, 45, 41, 0.12);
  --shadow-glow: 0 0 26px var(--accent-glow);

}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  letter-spacing: -0.01em;
}
button { font-family: var(--font-sans); }
.tabular-nums { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

#root { width: 100%; height: 100%; display: flex; flex-direction: column; }

/* ─── Top bar ─── */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 0 16px; flex-shrink: 0;
  background: var(--bg-secondary);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-subtle);
  z-index: 100;
}
.top-bar__left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-bar__brand { font-size: 15px; font-weight: 800; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
.top-bar__brand svg { color: var(--accent-primary); }
.alpha-badge {
  font-size: 9px; padding: 2px 6px; background: var(--accent-glow);
  border: 1px solid var(--border-accent); border-radius: 4px;
  color: var(--accent-secondary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.06em;
}
.top-bar__project { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 10px; border-left: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.top-bar__right { display: flex; align-items: center; gap: 8px; }

.seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-tertiary); }
.seg button {
  min-height: 24px; padding: 0 10px; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: background-color var(--transition-fast), color var(--transition-fast);
}
.seg button:hover { background: var(--bg-hover); color: var(--text-primary); }
.seg button.is-active { background: var(--bg-elevated); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all var(--transition-fast);
  border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-secondary);
  white-space: nowrap; letter-spacing: 0;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-highlight); color: var(--text-primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.985); transition-duration: 80ms; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn--primary { background: var(--accent-primary); color: #fff; border: none; font-weight: 600; }
.btn--primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: var(--shadow-glow); color: #fff; }
.btn--sm { padding: 4px 10px; font-size: 11px; border-radius: var(--radius-sm); }
.btn--icon { padding: 0; width: 30px; height: 30px; border-radius: var(--radius-md); background: transparent; border-color: transparent; color: var(--text-muted); }
.btn--icon:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); box-shadow: none; }
.btn--danger { color: var(--error); border-color: rgba(239, 68, 68, 0.25); }
.btn--danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.1); border-color: var(--error); color: var(--error); }

input[type="number"], input[type="text"] {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  color: var(--text-primary); background: var(--bg-tertiary);
  border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  padding: 5px 8px; font-size: 12px; outline: none;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
}
input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 2px var(--accent-glow); }
input:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

/* ─── Main grid ─── */
.main-content { display: flex; flex: 1; min-height: 0; position: relative; overflow: hidden; }

/* ─── Stage ─── */
.stage-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--app-gradient); position: relative; }
.stage-scene { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.stage-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 62%, rgba(216, 140, 122, 0.08) 0%, transparent 58%); pointer-events: none; }
.stage-floor { position: absolute; left: 50%; bottom: 10%; width: 46%; height: 2px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, rgba(216, 140, 122, 0.4), transparent); border-radius: 999px; pointer-events: none; }
.character-stand {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: charFloat 5s ease-in-out infinite alternate;
}
@keyframes charFloat { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.character-stand svg { filter: drop-shadow(0 14px 34px rgba(4, 5, 10, 0.5)); }
.character-tag {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px;
  border: 1px solid var(--border-default); border-radius: 999px;
  background: var(--bg-secondary); backdrop-filter: blur(8px);
  font-size: 11px; font-weight: 700; color: var(--text-secondary);
}
.character-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-character); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-character) 20%, transparent); }
.stage-caption { position: absolute; left: 16px; bottom: 14px; font-size: 10.5px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.02em; }

/* ─── Inspector ─── */
.inspector {
  width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg-secondary); border-left: 1px solid var(--border-subtle);
}
.inspector-header {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 11px 12px; border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface); box-shadow: var(--shadow-sm); flex-shrink: 0;
}
.inspector-header__intent { color: var(--accent-primary); font-size: 10px; font-weight: 800; letter-spacing: 0.04em; }
.inspector-header__title { color: var(--text-primary); font-size: 17px; font-weight: 800; line-height: 1.15; }
.inspector-header__meta { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.inspector-body { flex: 1; min-height: 0; overflow-y: auto; }
.inspector-content { width: min(100%, 390px); margin: 0 auto; padding: 16px; }
.inspector-section { padding: 4px 0 12px 0; }
.inspector-section-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); margin-bottom: 12px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.inspector-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 12px; margin-bottom: 8px; }
.inspector-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inspector-row input[type="number"], .inspector-row input[type="text"] { width: 100%; }

.custom-motion-card { border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); padding: 10px 10px 4px; margin-bottom: 10px; }
.custom-motion-card__head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.custom-motion-card__title { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
.custom-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-glow); border: 1px solid var(--border-accent); color: var(--accent-primary);
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
}
.motion-source-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 8px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  background: var(--bg-tertiary); margin-bottom: 8px;
}
.motion-source-row .mono { color: var(--text-primary); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.motion-source-row .hint { color: var(--text-muted); font-size: 10px; flex-shrink: 0; }
.track-stats-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin-bottom: 8px; color: var(--text-secondary); font-size: 11.5px; }
.track-stats-row .count { color: var(--text-primary); font-weight: 700; font-size: 12px; }
.inspector-hint { color: var(--text-muted); font-size: 10.5px; line-height: 1.45; margin: 6px 0 10px; }

.select-shell {
  width: 100%; min-height: 32px; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 10px; background: var(--bg-tertiary); border: 1px solid var(--border-default);
  border-radius: var(--radius-md); cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-primary);
}
.select-shell:hover { background: var(--bg-hover); border-color: var(--border-highlight); }
.select-shell .chev { color: var(--text-muted); }
.spacer { flex: 1; }

/* ─── Timeline ─── */
.timeline-area {
  height: 300px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg-primary); border-top: 1px solid var(--border-default); position: relative;
}
.timeline-scroll { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.timeline-hscroll { overflow-x: auto; overflow-y: hidden; height: 100%; position: relative; scrollbar-width: thin; }
.timeline-inner { position: relative; min-width: 100%; height: 100%; }

.ruler {
  height: 32px; position: sticky; top: 0; z-index: 100; display: flex;
  background: var(--bg-surface); border-bottom: 1px solid var(--border-default); cursor: crosshair; contain: content;
}
.ruler__header { width: 150px; flex-shrink: 0; border-right: 1px solid var(--border-subtle); background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.ruler__canvas { flex: 1; position: relative; }
.ruler__canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ruler-tick--major { stroke: var(--border-highlight); }
.ruler-tick--minor { stroke: var(--border-subtle); }
.ruler-tick__label { fill: var(--text-muted); font-family: var(--font-mono); font-size: 8.5px; font-weight: 600; }

.track-grid { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; }
.track-row {
  position: absolute; left: 0; right: 0; height: 34px; display: flex;
  border-bottom: 1px solid var(--border-subtle);
}
.track-row.is-expanded { position: relative; }
.track-row.is-expanded .track-label { height: 34px; }
.track-label {
  width: 150px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding-left: 12px; border-right: 1px solid var(--border-default);
  background: var(--bg-secondary); backdrop-filter: blur(8px);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary);
  position: relative;
}
.track-label::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--track-color, var(--accent-primary)); opacity: 0.5; }
.track-label .track-count { margin-left: auto; margin-right: 10px; font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
.track-lane { position: relative; flex: 1; min-width: 0; }
.track-lane--dialogue { --track-color: var(--color-dialogue); }
.track-lane--character { --track-color: var(--color-character); }
.track-lane--camera { --track-color: var(--color-camera); }

.track-block {
  position: absolute; top: 5px; height: 24px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--track-color) 22%, var(--bg-secondary));
  border: 1px solid color-mix(in srgb, var(--track-color) 45%, transparent);
  border-left: 3px solid var(--track-color);
  display: flex; align-items: center; gap: 6px; padding: 0 6px;
  font-size: 10.5px; font-weight: 600; color: var(--text-primary);
  cursor: pointer; overflow: hidden; white-space: nowrap;
  transition: filter var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
  z-index: 2;
}
.track-block:hover { filter: brightness(1.1); border-color: var(--border-highlight); }
.track-block.is-selected { border-color: var(--accent-primary); box-shadow: 0 0 0 1px var(--accent-glow); z-index: 3; }
.track-block.is-expanded-block { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.track-block .block-icon { display: flex; opacity: 0.85; flex-shrink: 0; }
.track-block .block-label { overflow: hidden; text-overflow: ellipsis; }
.track-block .block-sub { color: var(--text-muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.track-block .block-dur { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); flex-shrink: 0; }
.track-block .block-chevron { display: flex; color: var(--text-muted); flex-shrink: 0; transition: transform var(--transition-fast); }
.track-block .block-chevron.is-open { transform: rotate(180deg); color: var(--accent-primary); }
.track-block--custom { border-style: solid; }
.track-block--custom .custom-diamond { color: var(--accent-primary); flex-shrink: 0; display: flex; }

/* Expanded editor */
.expanded-editor {
  position: absolute; left: 0; right: 0; top: 34px; overflow: visible;
  animation: editorOpen 260ms var(--ease-emphasized);
  transform-origin: top;
}
@keyframes editorOpen { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.expanded-editor.is-closing { animation: editorClose 170ms ease-in forwards; }
@keyframes editorClose { from { opacity: 1; } to { opacity: 0; transform: translateY(-4px); } }

.editor-surface {
  margin: 3px 0 8px 0; border: 1px solid var(--border-default);
  border-radius: var(--radius-md); background: var(--bg-surface);
  box-shadow: var(--shadow-md); overflow: hidden;
}
.editor-surface--lanes { margin-left: 0; }
.editor-surface:not(.editor-surface--lanes) { margin-left: 150px; }
.editor-header {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 10px;
  border-bottom: 1px solid var(--border-subtle); background: var(--bg-secondary);
  flex-wrap: nowrap; min-height: 38px;
}
.editor-title { display: flex; align-items: center; gap: 7px; min-width: 0; flex-shrink: 1; }
.editor-title .custom-diamond { color: var(--accent-primary); display: flex; flex-shrink: 0; }
.editor-title__name { font-size: 12.5px; font-weight: 800; color: var(--text-primary); white-space: nowrap; }
.editor-title__src { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  const canvas = $('#ruler-canvas');
  const w = contentWidth();
  const svgNS = 'http://www.w3.org/2000/svg';
  canvas.innerHTML = '';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} 32`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const pxPerTick = 8;
  const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10];
  let step = steps.find((s) => s * state.pps >= pxPerTick) ?? 1;
  for (let t = 0; t <= SCENE_DURATION + 0.001; t += step) {
    const x = timeToX(t);
    const major = Math.abs(t - Math.round(t)) < 0.001;
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x); line.setAttribute('y1', major ? 0 : 18);
    line.setAttribute('x2', x); line.setAttribute('y2', 32);
    line.setAttribute('stroke', major ? 'var(--border-highlight)' : 'var(--border-subtle)');
    if (major) {
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', x + 3); label.setAttribute('y', 12);
      label.setAttribute('class', 'ruler-tick__label');
      label.textContent = `${Math.round(t)}.0`;
      svg.appendChild(label);
    }
    svg.appendChild(line);
  }
  canvas.appendChild(svg);
}

function selectedTrack(motion) {

function valueRange(track) {
  let min = Infinity, max = -Infinity;
  for (const kf of track.keyframes) { min = Math.min(min, kf.value); max = Math.max(max, kf.value); }
  for (const seg of track.keyframes) {
    if (seg.segment?.type === 'bezier') {
      for (const cp of seg.segment.controlPoints) { min = Math.min(min, cp.value); max = Math.max(max, cp.value); }
    }
  }
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  let pad = (max - min) * 0.18;
  if (pad === 0) pad = 1;
  return { min: min - pad, max: max + pad };
}

function segmentValueAt(kfA, kfB, t) {
  if (!kfA.segment || !kfB) return kfA.value;
  const type = kfA.segment.type;
  if (type === 'stepped') return kfA.value;
  if (type === 'inverseStepped') return kfB.value;
  if (type === 'bezier') {
    const [cp1, cp2] = kfA.segment.controlPoints;
    const u = clamp((t - kfA.time) / (kfB.time - kfA.time), 0, 1);
    const a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, c = 3 * (1 - u) * u ** 2, d = u ** 3;
    return a * kfA.value + b * cp1.value + c * cp2.value + d * kfB.value;
  }
  const u = clamp((t - kfA.time) / (kfB.time - kfA.time), 0, 1);
  return kfA.value + (kfB.value - kfA.value) * u;
}

function jumpToKeyframe(motion, dir) {
  const track = selectedTrack(motion);
  const cur = track.keyframes[state.selectedKf];
  if (!cur) return;
  let target = null;
  if (dir < 0) {
    for (let i = track.keyframes.length - 1; i >= 0; i--) {
      if (track.keyframes[i].time < cur.time - 0.0001) { target = track.keyframes[i]; break; }
    }
  } else {
    for (let i = 0; i < track.keyframes.length; i++) {
      if (track.keyframes[i].time > cur.time + 0.0001) { target = track.keyframes[i]; break; }
    }
  }
  if (!target) return;
  const idx = track.keyframes.indexOf(target);
  state.selectedKf = idx;
  state.selectedParam = track.parameterId;
  const block = findBlock(state.expandedId);
  state.playhead = round2(block.time + target.time);
  renderAll();
}

/* 可拖拽数值：按住左右拖动快速调节（AE 的数字拖动），单击仍可键入 */
function makeScrubbable(input, min, max, onSet) {
  const span = (max - min) || 1;
  const step = span / 160;
  let sx = 0, sv = 0, moved = false, dragging = false;
  const move = (e) => {
    if (!dragging) return;
    if (Math.abs(e.clientX - sx) > 3) moved = true;
    if (moved) onSet(clamp(sv + (e.clientX - sx) * step, min - span, max + span));
  };
  const up = () => {
    dragging = false;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (!moved) input.focus();
  };
  input.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragging = true; moved = false;
    sx = e.clientX; sv = Number(input.value) || 0;
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}

function kfNavButton(dir, disabled) {

    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7M13 5l9 7-9 7"/></svg>';
  return b;
}

function renderKeyframeLanes(motion) {
  const block = findBlock(state.expandedId);
  const laneH = 26;
  const laneW = contentWidth();

  const wrap = document.createElement('div');
  wrap.className = 'kf-lanes';

  const overlays = document.createElement('div');
  overlays.className = 'kf-lanes__overlays';
  overlays.style.cssText = 'position:absolute;left:150px;top:0;bottom:0;right:0;pointer-events:none;z-index:2;';

  if (motion.fadeInSeconds > 0) {
    const band = document.createElement('div');
    band.className = 'kf-lanes__fade';
    band.style.left = `${block.time * state.pps}px`;
    band.style.width = `${Math.min(motion.fadeInSeconds, motion.durationSeconds) * state.pps}px`;
    band.innerHTML = `<span>淡入 ${round2(motion.fadeInSeconds)}s</span>`;
    overlays.appendChild(band);
  }

  const playheadT = state.playhead - block.time;
  if (playheadT >= 0 && playheadT <= motion.durationSeconds) {
    const ph = document.createElement('div');
    ph.className = 'kf-lanes__playhead';
    ph.style.left = `${state.playhead * state.pps}px`;
    overlays.appendChild(ph);
  }

  const hint = document.createElement('div');
  hint.className = 'kf-lanes__hint';
  hint.textContent = '点空白加帧 · 拖菱形改时间/数值（Shift 微调）· 悬停行尾可进曲线视图';
  overlays.appendChild(hint);
  wrap.appendChild(overlays);

  for (const track of motion.tracks) {
    const lane = document.createElement('div');
    lane.className = 'kf-lane' + (state.selectedParam === track.parameterId ? ' is-active' : '');
    lane.style.height = `${laneH}px`;

    const label = document.createElement('div');
    label.className = 'kf-lane__label';
    const idSpan = document.createElement('span');
    idSpan.className = 'mono';
    idSpan.textContent = track.parameterId;
    label.appendChild(idSpan);
    const count = document.createElement('span');
    count.className = 'kf-count';
    count.textContent = String(track.keyframes.length);
    label.appendChild(count);
    const curveBtn = document.createElement('button');
    curveBtn.className = 'kf-lane__curve-btn';
    curveBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4-8 14-8 18 0"/><path d="M3 7c4 2 8 2 12 0"/></svg>';
    curveBtn.title = '在此参数上打开曲线视图';
    curveBtn.setAttribute('aria-label', `在曲线视图中编辑 ${track.parameterId}`);
    curveBtn.addEventListener('click', () => {
      state.selectedParam = track.parameterId;
      state.view = 'graph';
      state.selectedKf = null;
      renderAll();
    });
    label.appendChild(curveBtn);
    lane.appendChild(label);

    const canvas = document.createElement('div');
    canvas.className = 'kf-lane__canvas';
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${laneW} ${laneH}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('data-param', track.parameterId);
    svg.setAttribute('aria-label', `${track.parameterId} 关键帧`);
    svg.setAttribute('role', 'img');

    const pathGroup = document.createElementNS(svgNS, 'g');
    const kfs = track.keyframes;
    for (let i = 0; i < kfs.length - 1; i++) {
      const a = kfs[i], b = kfs[i + 1];
      const path = document.createElementNS(svgNS, 'path');
      let d;
      if (a.segment?.type === 'stepped') {
        d = `M ${(block.time + a.time) * state.pps} 13 L ${(block.time + b.time) * state.pps} 13 L ${(block.time + b.time) * state.pps} 13`;
      } else if (a.segment?.type === 'inverseStepped') {
        d = `M ${(block.time + a.time) * state.pps} 13 L ${(block.time + a.time) * state.pps} 13 L ${(block.time + b.time) * state.pps} 13`;
      } else if (a.segment?.type === 'bezier') {
        const [cp1, cp2] = a.segment.controlPoints;
        d = `M ${(block.time + a.time) * state.pps} 13 C ${(block.time + cp1.time) * state.pps} 13, ${(block.time + cp2.time) * state.pps} 13, ${(block.time + b.time) * state.pps} 13`;
      } else {
        d = `M ${(block.time + a.time) * state.pps} 13 L ${(block.time + b.time) * state.pps} 13`;
      }
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--accent-primary)');
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.35');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      pathGroup.appendChild(path);
    }
    svg.appendChild(pathGroup);

    const kfGroup = document.createElementNS(svgNS, 'g');
    kfs.forEach((kf, idx) => {
      const isF0 = idx === 0 && Math.abs(kf.time) < 0.001;
      const isSelected = state.selectedKf === idx && state.selectedParam === track.parameterId;
      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('data-kf', String(idx));
      g.style.cursor = 'grab';
      const cx = (block.time + kf.time) * state.pps;
      const cy = laneH / 2;
      const size = isSelected ? 6 : 5;
      const d = document.createElementNS(svgNS, 'path');
      d.setAttribute('d', `M ${cx} ${cy - size} L ${cx + size} ${cy} L ${cx} ${cy + size} L ${cx - size} ${cy} Z`);
      d.setAttribute('fill', isSelected ? 'var(--accent-primary)' : 'var(--bg-elevated)');
      d.setAttribute('stroke', isSelected ? 'var(--accent-hover)' : isF0 ? 'var(--accent-secondary)' : 'var(--accent-primary)');
      d.setAttribute('stroke-width', '1.5');
      d.setAttribute('vector-effect', 'non-scaling-stroke');
      d.setAttribute('style', 'transition: transform var(--transition-fast); transform-origin: center; transform-box: fill-box;');
      g.appendChild(d);
      if (isF0) {
        const lock = document.createElementNS(svgNS, 'circle');
        lock.setAttribute('cx', cx); lock.setAttribute('cy', cy);
        lock.setAttribute('r', '9');
        lock.setAttribute('fill', 'none');
        lock.setAttribute('stroke', 'var(--accent-primary)');
        lock.setAttribute('stroke-dasharray', '2 2');
        lock.setAttribute('opacity', '0.5');
        lock.setAttribute('stroke-width', '1');
        lock.setAttribute('vector-effect', 'non-scaling-stroke');
        g.appendChild(lock);
      }
      const hit = document.createElementNS(svgNS, 'circle');
      hit.setAttribute('cx', cx); hit.setAttribute('cy', cy); hit.setAttribute('r', '9');
      hit.setAttribute('fill', 'transparent');
      hit.style.cursor = 'grab';
      g.appendChild(hit);
      g.addEventListener('pointerdown', (e) => startLaneKeyframeDrag(e, track, idx));
      g.addEventListener('mouseenter', () => { d.style.transform = 'scale(1.2)'; showKfTooltip(track.parameterId, kf, g); });
      g.addEventListener('mouseleave', () => { d.style.transform = 'scale(1)'; hideKfTooltip(); });
      kfGroup.appendChild(g);
    });
    svg.appendChild(kfGroup);

    svg.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-kf]')) return;
      const rect = svg.getBoundingClientRect();
      const sceneT = ((e.clientX - rect.left) / rect.width) * laneW / state.pps;
      const t = clamp(sceneT - block.time, 0, motion.durationSeconds);
      const time = round2(Math.round(t / 0.05) * 0.05);
      if (track.keyframes.some((k) => Math.abs(k.time - time) < 0.001)) return;
      const i = track.keyframes.findIndex((k) => k.time > time);
      const value = i === -1
        ? track.keyframes[track.keyframes.length - 1].value
        : segmentValueAt(track.keyframes[i - 1], track.keyframes[i], time);
      if (i === -1) {
        track.keyframes.push({ time, value, segment: { type: 'linear' } });
      } else {
        const segment = track.keyframes[i - 1]?.segment ?? { type: 'linear' };
        track.keyframes.splice(i, 0, { time, value, segment });
      }
      track.keyframes.sort((a, b) => a.time - b.time);
      state.selectedParam = track.parameterId;
      state.selectedKf = track.keyframes.findIndex((k) => Math.abs(k.time - time) < 0.001);
      renderAll();
    });

    canvas.appendChild(svg);
    lane.appendChild(canvas);
    wrap.appendChild(lane);
  }
  return wrap;
}

function startLaneKeyframeDrag(e, track, idx) {
  e.preventDefault();
  e.stopPropagation();
  const block = findBlock(state.expandedId);
  const motion = block.motion;
  const kf = track.keyframes[idx];
  const isF0 = idx === 0 && Math.abs(kf.time) < 0.001;
  const range = valueRange(track);
  const startY = e.clientY;
  const startValue = kf.value;
  state.selectedParam = track.parameterId;
  state.selectedKf = idx;
  state.drag = { idx, isF0, param: track.parameterId };
  hideKfTooltip();
  renderAll();
  const move = (ev) => {
    if (!track.keyframes[idx]) { up(); return; }
    const svgEl = document.querySelector(`.kf-lane__canvas svg[data-param="${track.parameterId}"]`);
    if (!svgEl) return;
    const r = svgEl.getBoundingClientRect();
    const laneH = r.height || 26;
    const sceneT = ((ev.clientX - r.left) / r.width) * contentWidth() / state.pps;
    const time = round2(clamp(sceneT - block.time, 0, motion.durationSeconds));
    const dv = (startY - ev.clientY) / laneH * (range.max - range.min);
    const value = round2(ev.shiftKey ? startValue + dv * 0.1 : startValue + dv);
    if (!isF0) {
      const clash = track.keyframes.some((k, i) => i !== idx && Math.abs(k.time - time) < 0.001);
      if (!clash) track.keyframes[idx].time = time;
    }
    track.keyframes[idx].value = clamp(value, -1000, 1000);
    showDragReadout(`${formatTime(track.keyframes[idx].time)} · ${round2(track.keyframes[idx].value)}${ev.shiftKey ? ' · Shift' : ''}`, ev.clientX, ev.clientY);
    renderAll();
  };
  const up = () => {
    hideDragReadout();
    state.drag = null;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function renderCurve(motion) {
  const block = findBlock(state.expandedId);
  const track = selectedTrack(motion);
  const range = valueRange(track);
  const dur = motion.durationSeconds;
  const height = 148;
  const padT = 16, padB = 18, padR = 12;
  const innerW = contentWidth() - padR;
  const innerH = height - padT - padB;
  const xOf = (t) => (block.time + t) * state.pps;
  const yOf = (v) => padT + (1 - (v - range.min) / (range.max - range.min)) * innerH;

  const wrap = document.createElement('div');
  wrap.className = 'editor-curve-wrap';

  const labels = document.createElement('div');
  labels.className = 'curve-labels';
  labels.innerHTML = `<span>${round2(range.max)}</span><span>${round2(range.min)}</span>`;
  wrap.appendChild(labels);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'curve-canvas');
  svg.setAttribute('viewBox', `0 0 ${contentWidth()} ${height}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-label', `${track.parameterId} 关键帧曲线`);
  svg.setAttribute('role', 'img');

  const grid = document.createElementNS(svgNS, 'g');
  const startT = block.time;
  const endT = block.time + dur;
  for (let t = Math.floor(startT * 2) / 2; t <= endT + 0.001; t += 0.5) {
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', t * state.pps); line.setAttribute('y1', padT);
    line.setAttribute('x2', t * state.pps); line.setAttribute('y2', height - padB);
    line.setAttribute('stroke', 'var(--border-subtle)');
    line.setAttribute('stroke-dasharray', t % 1 === 0 ? 'none' : '2 3');
    grid.appendChild(line);
  }
  const hStep = (range.max - range.min) / 4;
  for (let i = 0; i <= 4; i++) {
    const v = range.min + hStep * i;
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', block.time * state.pps); line.setAttribute('y1', yOf(v));
    line.setAttribute('x2', (block.time + dur) * state.pps); line.setAttribute('y2', yOf(v));
    line.setAttribute('stroke', 'var(--border-subtle)');
    line.setAttribute('stroke-dasharray', '2 4');
    grid.appendChild(line);
  }
  const zero = document.createElementNS(svgNS, 'line');
  zero.setAttribute('x1', block.time * state.pps); zero.setAttribute('y1', yOf(0));
  zero.setAttribute('x2', (block.time + dur) * state.pps); zero.setAttribute('y2', yOf(0));
  zero.setAttribute('stroke', 'var(--border-highlight)');
  zero.setAttribute('opacity', '0.55');
  grid.appendChild(zero);
  svg.appendChild(grid);

  const fadeIn = motion.fadeInSeconds;
  if (fadeIn > 0) {
    const band = document.createElementNS(svgNS, 'rect');
    band.setAttribute('x', xOf(0)); band.setAttribute('y', padT);
    band.setAttribute('width', Math.min(fadeIn, dur) * state.pps);
    band.setAttribute('height', innerH);
    band.setAttribute('fill', 'var(--accent-glow)');
    band.setAttribute('opacity', '0.6');
    const fadeLabel = document.createElementNS(svgNS, 'text');
    fadeLabel.setAttribute('x', xOf(0) + 6); fadeLabel.setAttribute('y', padT + 12);
    fadeLabel.setAttribute('fill', 'var(--accent-primary)');
    fadeLabel.setAttribute('font-family', 'var(--font-mono)');
    fadeLabel.setAttribute('font-size', '9');
    fadeLabel.textContent = `淡入 ${round2(fadeIn)}s`;
    svg.appendChild(band);
    svg.appendChild(fadeLabel);
  }

  const pathGroup = document.createElementNS(svgNS, 'g');
  const kfs = track.keyframes;
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    const path = document.createElementNS(svgNS, 'path');
    let d;
    if (a.segment?.type === 'stepped') {
      d = `M ${xOf(a.time)} ${yOf(a.value)} L ${xOf(b.time)} ${yOf(a.value)} L ${xOf(b.time)} ${yOf(b.value)}`;
    } else if (a.segment?.type === 'inverseStepped') {
      d = `M ${xOf(a.time)} ${yOf(a.value)} L ${xOf(a.time)} ${yOf(b.value)} L ${xOf(b.time)} ${yOf(b.value)}`;
    } else if (a.segment?.type === 'bezier') {
      const [cp1, cp2] = a.segment.controlPoints;
      d = `M ${xOf(a.time)} ${yOf(a.value)} C ${xOf(cp1.time)} ${yOf(cp1.value)}, ${xOf(cp2.time)} ${yOf(cp2.value)}, ${xOf(b.time)} ${yOf(b.value)}`;
    } else {
      d = `M ${xOf(a.time)} ${yOf(a.value)} L ${xOf(b.time)} ${yOf(b.value)}`;
    }
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent-primary)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    pathGroup.appendChild(path);
  }
  svg.appendChild(pathGroup);

  if (state.selectedKf !== null && kfs[state.selectedKf]?.segment?.type === 'bezier' && kfs[state.selectedKf + 1]) {
    const a = kfs[state.selectedKf], b = kfs[state.selectedKf + 1];
    const [cp1, cp2] = a.segment.controlPoints;
    const handle = document.createElementNS(svgNS, 'g');
    for (const [cp, kf] of [[cp1, a], [cp2, b]]) {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', xOf(kf.time)); line.setAttribute('y1', yOf(kf.value));
      line.setAttribute('x2', xOf(cp.time)); line.setAttribute('y2', yOf(cp.value));
      line.setAttribute('stroke', 'var(--accent-secondary)');
      line.setAttribute('stroke-dasharray', '3 3');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      handle.appendChild(line);
    }
    for (const [idx, cp] of [cp1, cp2].entries()) {
      const c = document.createElementNS(svgNS, 'rect');
      c.setAttribute('x', xOf(cp.time) - 3); c.setAttribute('y', yOf(cp.value) - 3);
      c.setAttribute('width', 6); c.setAttribute('height', 6);
      c.setAttribute('rx', 1);
      c.setAttribute('fill', 'var(--bg-elevated)');
      c.setAttribute('stroke', 'var(--accent-secondary)');
      c.setAttribute('data-cp', String(idx));
      c.style.cursor = 'grab';
      handle.appendChild(c);
    }
    svg.appendChild(handle);
  }

  const kfGroup = document.createElementNS(svgNS, 'g');
  for (let i = 0; i < kfs.length; i++) {
    const kf = kfs[i];
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('data-kf', String(i));
    g.style.cursor = 'grab';
    const isF0 = i === 0 && Math.abs(kf.time) < 0.001;
    const isSelected = state.selectedKf === i;
    const d = document.createElementNS(svgNS, 'path');
    const cx = xOf(kf.time), cy = yOf(kf.value);
    const size = isSelected ? 6.5 : 5.5;
    d.setAttribute('d', `M ${cx} ${cy - size} L ${cx + size} ${cy} L ${cx} ${cy + size} L ${cx - size} ${cy} Z`);
    d.setAttribute('fill', isSelected ? 'var(--accent-primary)' : 'var(--bg-elevated)');
    d.setAttribute('stroke', isSelected ? 'var(--accent-hover)' : isF0 ? 'var(--accent-secondary)' : 'var(--accent-primary)');
    d.setAttribute('stroke-width', '1.6');
    d.setAttribute('vector-effect', 'non-scaling-stroke');
    d.setAttribute('style', 'transition: transform var(--transition-fast); transform-origin: center; transform-box: fill-box;');
    g.appendChild(d);
    if (isF0) {
      const lock = document.createElementNS(svgNS, 'circle');
      lock.setAttribute('cx', cx); lock.setAttribute('cy', cy);
      lock.setAttribute('r', '9');
      lock.setAttribute('fill', 'none');
      lock.setAttribute('stroke', 'var(--accent-primary)');
      lock.setAttribute('stroke-dasharray', '2 2');
      lock.setAttribute('opacity', '0.5');
      lock.setAttribute('stroke-width', '1');
      lock.setAttribute('vector-effect', 'non-scaling-stroke');
      g.appendChild(lock);
    }
    const hit = document.createElementNS(svgNS, 'circle');
    hit.setAttribute('cx', cx); hit.setAttribute('cy', cy); hit.setAttribute('r', '9');
    hit.setAttribute('fill', 'transparent');
    hit.style.cursor = 'grab';
    g.appendChild(hit);
    g.addEventListener('pointerdown', (e) => startKeyframeDrag(e, i));
    g.addEventListener('mouseenter', () => { d.style.transform = 'scale(1.2)'; showKfTooltip(track.parameterId, kf, g); });
    g.addEventListener('mouseleave', () => { d.style.transform = 'scale(1)'; hideKfTooltip(); });
    kfGroup.appendChild(g);
  }
  svg.appendChild(kfGroup);

  svg.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-kf]') || e.target.closest('[data-cp]')) return;
    const rect = svg.getBoundingClientRect();
    const sceneT = ((e.clientX - rect.left) / rect.width) * contentWidth() / state.pps;
    const t = clamp(sceneT - block.time, 0, dur);
    const time = round2(Math.round(t / 0.05) * 0.05);
    const existing = track.keyframes.find((k) => Math.abs(k.time - time) < 0.001);
    if (existing) {
      const idx = track.keyframes.indexOf(existing);
      state.selectedKf = idx;
      renderAll();
      return;
    }
    const value = round2(range.max - ((e.clientY - rect.top) / rect.height) * (range.max - range.min));
    const i = track.keyframes.findIndex((k) => k.time > time);
    if (i === -1) {
      track.keyframes.push({ time, value });
    } else {
      const prev = track.keyframes[i - 1];
      const segment = prev && i - 1 !== track.keyframes.length - 1
        ? prev.segment ?? { type: 'linear' }
        : { type: 'linear' };
      track.keyframes.splice(i, 0, { time, value, segment });
    }
    track.keyframes.sort((a, b) => a.time - b.time);
    state.selectedKf = track.keyframes.findIndex((k) => Math.abs(k.time - time) < 0.001);
    renderAll();
  });

  wrap.appendChild(svg);

  const hint = document.createElement('div');
  hint.className = 'curve-hint';
  hint.textContent = '点曲线空白处添加关键帧 · 拖动菱形调整时间/数值（Shift 微调）· 首帧 (0.0s) 锁定';
  wrap.appendChild(hint);

  const playheadOverlay = renderPlayheadOverlay(motion);
  if (playheadOverlay) wrap.appendChild(playheadOverlay);
  return wrap;
}

function renderKeyframeToolbar(motion, track, idx) {
  const bar = document.createElement('div');
  bar.className = 'kf-toolbar';
  bar.style.cssText = `
    display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-height: 32px;
    border-bottom: 1px solid var(--border-subtle); background: var(--bg-elevated);
    font-size: 11px; flex-wrap: wrap;
  `;
  if (state.selectedKf === null) {
    const hint = document.createElement('span');
    hint.style.cssText = 'color: var(--text-muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;';
    hint.textContent = '点击一个关键帧进行编辑 · 拖动菱形可同时调整时间与数值（← → 在关键帧间跳转）';
    bar.appendChild(hint);
    return bar;
  }
  const kf = track.keyframes[idx];
  const isF0 = idx === 0 && Math.abs(kf.time) < 0.001;
  const kfRange = valueRange(track);
  const id = document.createElement('span');
  id.style.cssText = 'color: var(--text-muted); font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em;';
  id.textContent = `关键帧 ${idx + 1}${isF0 ? ' · 首帧（锁定）' : ''}`;
  bar.appendChild(id);

  const nav = document.createElement('span');
  nav.style.cssText = 'display:inline-flex;align-items:center;gap:2px;flex-shrink:0;';
  const prevBtn = kfNavButton(-1, idx === 0);
  prevBtn.addEventListener('click', () => jumpToKeyframe(motion, -1));
  const nextBtn = kfNavButton(1, idx === track.keyframes.length - 1);
  nextBtn.addEventListener('click', () => jumpToKeyframe(motion, 1));
  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  bar.appendChild(nav);

  const mkInput = (label, value, min, max, step, onCommit, disabled) => {
    const wrapInput = document.createElement('label');
    wrapInput.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-weight:700;';
    wrapInput.innerHTML = `<span>${label}</span>`;
    const input = document.createElement('input');
    input.type = 'number';
    input.step = String(step);
    input.min = String(min);
    input.max = String(max);
    input.value = String(value);
    input.disabled = !!disabled;
    input.style.width = '58px';
    input.setAttribute('aria-label', label);
    input.addEventListener('change', () => onCommit(Number(input.value)));
    wrapInput.appendChild(input);
    return wrapInput;
  };

  const timeInput = mkInput('时间', round2(kf.time), 0, round2(motion.durationSeconds), 0.01, (v) => {
    if (isF0) return;
    const vv = round2(clamp(v, 0, motion.durationSeconds));
    const clash = track.keyframes.some((k, i) => i !== idx && Math.abs(k.time - vv) < 0.001);
    if (clash) { toast('该时刻已有关键帧，请换一个时间', 'error'); return; }
    kf.time = vv;
    track.keyframes.sort((a, b) => a.time - b.time);
    renderAll();
  }, isF0);
  bar.appendChild(timeInput);

  const valueInput = mkInput('值', round2(kf.value), -1000, 1000, 0.05, (v) => {
    kf.value = round2(clamp(v, -1000, 1000));
    renderAll();
  }, false);
  bar.appendChild(valueInput);
  makeScrubbable(valueInput, kfRange.min, kfRange.max, (v) => {
    kf.value = round2(clamp(v, -1000, 1000));
    renderAll();
  });

  if (idx < track.keyframes.length - 1) {
    const segWrap = document.createElement('label');
    segWrap.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--text-muted);font-weight:700;';
    segWrap.innerHTML = '<span>分段</span>';
    const seg = document.createElement('select');
    seg.style.cssText = 'padding:3px 6px;font-size:10.5px;color:var(--text-primary);background:var(--bg-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-sm);outline:none;cursor:pointer;';
    seg.setAttribute('aria-label', '关键帧分段类型');
    const segType = kf.segment?.type ?? 'linear';
    for (const [val, label] of [['linear', '直线'], ['bezier', '贝塞尔'], ['stepped', '阶梯'], ['inverseStepped', '逆阶梯']]) {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = label;
      if (val === segType) opt.selected = true;
      seg.appendChild(opt);
    }
    seg.addEventListener('change', () => {
      const next = { type: seg.value };
      if (seg.value === 'bezier') {
        const nxt = track.keyframes[idx + 1];
        const dx = nxt.time - kf.time;
        next.controlPoints = [
          { time: round2(kf.time + dx * 0.35), value: round2(kf.value) },
          { time: round2(kf.time + dx * 0.65), value: round2(nxt.value) },
        ];
      }
      kf.segment = next;
      renderAll();
    });
    segWrap.appendChild(seg);
    bar.appendChild(segWrap);
  }

  const del = document.createElement('button');
  del.className = 'btn btn--sm btn--danger';
  del.style.cssText = 'margin-left:auto;';
  del.textContent = '删除';
  del.disabled = isF0;
  del.addEventListener('click', () => {
    if (isF0) { toast('首帧 (0.0s) 受保护，不能删除', 'error'); return; }
    track.keyframes.splice(idx, 1);
    state.selectedKf = null;
    renderAll();
  });
  bar.appendChild(del);
  return bar;
}

function renderPlayheadOverlay(motion) {
  const block = findBlock(state.expandedId);
  const t = state.playhead - block.time;
  if (t < 0 || t > motion.durationSeconds) return null;
  const el = document.createElement('div');
  el.style.cssText = `
    position: absolute; top: 0; bottom: 0; left: ${(block.time + t) * state.pps}px;
    width: 1px; background: var(--accent-primary); opacity: 0.75; pointer-events: none; z-index: 3;
  `;
  return el;
}

function startKeyframeDrag(e, idx) {
  e.preventDefault();
  e.stopPropagation();
  const block = findBlock(state.expandedId);
  const motion = block.motion;
  const track = selectedTrack(motion);
  const range = valueRange(track);
  const kf = track.keyframes[idx];
  const isF0 = idx === 0 && Math.abs(kf.time) < 0.001;
  state.selectedKf = idx;
  state.drag = { idx, isF0 };
  hideKfTooltip();
  renderAll();
  const move = (ev) => {
    if (!track.keyframes[idx]) { up(); return; }
    const svgEl = document.querySelector('.curve-canvas');
    if (!svgEl) return;
    const r = svgEl.getBoundingClientRect();
    const sceneT = ((ev.clientX - r.left) / r.width) * contentWidth() / state.pps;
    const time = round2(clamp(sceneT - block.time, 0, motion.durationSeconds));
    const normY = 1 - (ev.clientY - r.top) / (r.height || 148);
    const midV = (range.max + range.min) / 2;
    const value = round2(ev.shiftKey
      ? midV + (normY - 0.5) * (range.max - range.min) * 0.1
      : range.min + normY * (range.max - range.min));
    const current = track.keyframes[idx];
    if (current) {
      if (!isF0) {
        const clash = track.keyframes.some((k, i) => i !== idx && Math.abs(k.time - time) < 0.001);
        if (!clash) current.time = time;
      }
      current.value = clamp(value, -1000, 1000);
      showDragReadout(`${formatTime(current.time)} · ${round2(current.value)}${ev.shiftKey ? ' · Shift' : ''}`, ev.clientX, ev.clientY);
    }
    renderAll();
  };
  const up = () => {
    hideDragReadout();
    state.drag = null;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function renderKeyframeList(motion) {
  const track = selectedTrack(motion);
  const list = document.createElement('div');
  list.className = 'kf-list';
  const head = document.createElement('div');
  head.className = 'kf-list__head';
  head.innerHTML = `<span>${track.parameterId} 关键帧</span><span class="mono">${track.keyframes.length} 帧 · 时长 ${round2(motion.durationSeconds)}s</span>`;
  list.appendChild(head);
  track.keyframes.forEach((kf, idx) => {
    const isF0 = idx === 0 && Math.abs(kf.time) < 0.001;
    const row = document.createElement('div');
    row.className = 'kf-row' + (state.selectedKf === idx ? ' is-selected' : '');
    row.addEventListener('click', () => {
      state.selectedKf = state.selectedKf === idx ? null : idx;
      renderAll();
    });
    const idxCell = document.createElement('span');
    idxCell.className = 'kf-idx';
    idxCell.innerHTML = `${isF0 ? '<span class="lock"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>' : ''}${idx + 1}`;
    row.appendChild(idxCell);

    const tInput = document.createElement('input');
    tInput.type = 'number';
    tInput.step = '0.01';
    tInput.min = '0';
    tInput.max = String(round2(motion.durationSeconds));
    tInput.value = String(round2(kf.time));
    tInput.disabled = isF0;
    tInput.setAttribute('aria-label', `关键帧 ${idx + 1} 时间`);
    tInput.addEventListener('change', (e) => {
      const v = round2(clamp(Number(e.target.value) || 0, 0, motion.durationSeconds));
      const clash = track.keyframes.some((k, i) => i !== idx && Math.abs(k.time - v) < 0.001);
      if (clash) { toast('该时刻已有关键帧，请换一个时间', 'error'); e.target.value = round2(kf.time); return; }
      kf.time = v;
      track.keyframes.sort((a, b) => a.time - b.time);
      renderAll();
    });
    row.appendChild(tInput);

    const vInput = document.createElement('input');
    vInput.type = 'number';
    vInput.step = '0.05';
    vInput.value = String(round2(kf.value));
    vInput.setAttribute('aria-label', `关键帧 ${idx + 1} 值`);
    vInput.addEventListener('change', (e) => {
      kf.value = round2(Number(e.target.value) || 0);
      renderAll();
    });
    row.appendChild(vInput);

    const seg = document.createElement('select');
    seg.className = 'seg-select';
    seg.setAttribute('aria-label', `关键帧 ${idx + 1} 分段类型`);
    const segType = kf.segment?.type ?? 'linear';
    if (idx < track.keyframes.length - 1) {
      for (const [val, label] of [['linear', '直线'], ['bezier', '贝塞尔'], ['stepped', '阶梯'], ['inverseStepped', '逆阶梯']]) {
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = label;
        if (val === segType) opt.selected = true;
        seg.appendChild(opt);
      }
    } else {
      const opt = document.createElement('option');
      opt.textContent = '—';
      opt.selected = true;
      seg.appendChild(opt);
      seg.disabled = true;
    }
    seg.addEventListener('change', (e) => {
      e.stopPropagation();
      const next = { type: seg.value };
      if (seg.value === 'bezier') {
        const nxt = track.keyframes[idx + 1];
        const dx = nxt.time - kf.time;
        next.controlPoints = [
          { time: round2(kf.time + dx * 0.35), value: round2(kf.value) },
          { time: round2(kf.time + dx * 0.65), value: round2(nxt.value) },
        ];
      }
      kf.segment = next;
      renderAll();
    });
    row.appendChild(seg);

    const del = document.createElement('button');
    del.className = 'kf-del';
    del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
    del.disabled = isF0;
    del.setAttribute('aria-label', `删除关键帧 ${idx + 1}`);
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isF0) { toast('首帧 (0.0s) 受保护，不能删除', 'error'); return; }
      track.keyframes.splice(idx, 1);
      state.selectedKf = null;
      renderAll();
    });
    row.appendChild(del);
    list.appendChild(row);
  });
  return list;
}

/* ─────────── 转换对话框 ─────────── */
function openConversionDialog(block) {
  state.dialog = { kind: 'conversion', blockId: block.id, density: 'standard', busy: false };
  renderDialog();
}

function simulateConversion(block, density) {
  const src = CONVERTIBLE_MOTIONS[block.motion.key];
  const motion = {
    kind: 'custom',
    durationSeconds: src.durationSeconds,
    fadeInSeconds: block.motion.fadeInSeconds ?? src.fadeInSeconds,
    derivedFrom: { key: block.motion.key, fadeInSeconds: src.derivedFromFadeIn, fadeOutSeconds: src.derivedFromFadeOut },
    tracks: [],
  };
  const fps = 30;
  const tolerance = density === 'perFrame' ? 0
    : density === 'sparse' ? 0.05
    : density === 'fine' ? 0.005
    : 0.02;
  for (const [paramId, fn] of Object.entries(src.curves)) {
    const samples = [];
    for (let f = 0; f <= src.durationSeconds * fps; f++) {
      const t = f / fps;
      samples.push({ time: round2(t), value: round2(fn(t)) });
    }
    if (tolerance === 0) {
      motion.tracks.push({ parameterId: paramId, keyframes: samples.map((s) => ({ ...s, segment: { type: 'linear' } })) });
      continue;
    }
    const kept = [samples[0]];
    for (let i = 1; i < samples.length - 1; i++) {
      const last = kept[kept.length - 1];
      const next = samples[samples.length - 1];
      const interp = last.value + (next.value - last.value) * ((samples[i].time - last.time) / (next.time - last.time));
      if (Math.abs(interp - samples[i].value) > tolerance) kept.push(samples[i]);
    }
    kept.push(samples[samples.length - 1]);
    const keyframes = kept.map((s, i) => ({
      ...s,
      segment: i < kept.length - 1 ? { type: 'linear' } : undefined,
    }));
    motion.tracks.push({ parameterId: paramId, keyframes });
  }
  motion.tracks.forEach((t) => {
    if (t.keyframes.length === 2 && Math.abs(t.keyframes[0].value - t.keyframes[1].value) < 0.001) {
      STATIC_TRACK_IDS.add(t.parameterId);
    }
  });
  return motion;
}

function estimateKeyframes(block, density) {
  const src = CONVERTIBLE_MOTIONS[block.motion.key];
  let total = 0;
  const fps = 30;
  const tolerance = density === 'perFrame' ? 0
    : density === 'sparse' ? 0.05
    : density === 'fine' ? 0.005
    : 0.02;
  for (const fn of Object.values(src.curves)) {
    const samples = [];
    for (let f = 0; f <= src.durationSeconds * fps; f++) {
      const t = f / fps;
      samples.push({ time: t, value: fn(t) });
    }
    if (tolerance === 0) { total += samples.length; continue; }
    let count = 2;
    let lastVal = samples[0].value;
    for (let i = 1; i < samples.length - 1; i++) {
      const last = samples[0];
      const next = samples[samples.length - 1];
      const interp = last.value + (next.value - last.value) * ((samples[i].time - last.time) / (next.time - last.time));
      if (Math.abs(interp - samples[i].value) > tolerance || Math.abs(samples[i].value - lastVal) > tolerance * 6) { count++; lastVal = samples[i].value; }
    }
    total += count;
  }
  return total;
}

function renderDialog() {
  const root = $('#dialog-root');
  root.innerHTML = '';
  if (!state.dialog) return;
  const d = state.dialog;
  if (d.kind !== 'conversion') return;

  const block = findBlock(d.blockId);
  const densities = [
    { id: 'sparse', name: '稀疏', desc: '最少关键帧，曲线最平滑（拟合误差 5%）' },
    { id: 'standard', name: '标准', desc: '平衡精度与可编辑性，推荐（误差 2%）' },
    { id: 'fine', name: '精细', desc: '保留更多细节（误差 0.5%）' },
    { id: 'perFrame', name: '逐帧', desc: '每个场景帧一个关键帧，最精确也最庞大' },
  ];

  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', '转为自定义动作');

  const surface = document.createElement('div');
  surface.className = 'dialog-surface';
  surface.innerHTML = `
    <div class="dialog-header">
      <div class="dialog-title">转为自定义动作</div>
      <button class="btn btn--icon" data-close aria-label="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="dialog-body">
      <div class="conv-info">
        <div><span>角色</span><strong>小夜</strong></div>
        <div><span>源动作</span><strong class="mono">${block.motion.key}</strong></div>
        <div><span>时长</span><strong class="mono">${formatTime(block.motion.durationSeconds ?? CONVERTIBLE_MOTIONS[block.motion.key]?.durationSeconds ?? block.duration)}</strong></div>
        <div><span>密度档位</span><strong>${densityName(d.density)}</strong></div>
      </div>
      <div class="density-grid" role="radiogroup" aria-label="关键帧密度">
        ${densities.map((den) => `
          <div class="density-card ${d.density === den.id ? 'is-selected' : ''}" role="radio" aria-checked="${d.density === den.id}" data-density="${den.id}" tabindex="0">
            <div class="density-card__radio"></div>
            <div><div class="density-card__name">${den.name}</div><div class="density-card__desc">${den.desc}</div></div>
            <div class="density-card__est">约 ${estimateKeyframes(block, den.id)} 帧</div>
          </div>`).join('')}
      </div>
      <div class="conv-note">转换把源动作的参数曲线采样并拟合为线性关键帧（拟合算法 v1）。转换是非破坏性的：源动作文件不会被修改；转换后仍可随时回到这里重选密度重新转换。</div>
      ${state.collabBusy ? '<div class="conv-blocker">协作者「小白」正持有此动作的编辑租约。请等待对方释放后再转换。</div>' : ''}
    </div>
    <div class="dialog-footer">
      <button class="btn" data-close>取消</button>
      <button class="btn btn--primary ${d.busy ? 'btn--busy' : ''}" data-convert>${d.busy ? '<span class="spinner"></span>采样拟合中…' : '开始转换'}</button>
    </div>`;

  overlay.appendChild(surface);
  root.appendChild(overlay);

  overlay.addEventListener('pointerdown', (e) => {
    if (e.target === overlay) closeDialog();
  });
  surface.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', closeDialog));
  surface.querySelectorAll('.density-card').forEach((card) => {
    const activate = () => {
      d.density = card.dataset.density;
      renderDialog();
    };
    card.addEventListener('click', activate);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });
  });
  const convertBtn = surface.querySelector('[data-convert]');
  convertBtn.addEventListener('click', () => {
    if (state.collabBusy) {
      toast('编辑租约被协作者占用，无法转换', 'error');
      return;
    }
    d.busy = true;
    renderDialog();
    setTimeout(() => {
      const block = findBlock(d.blockId);
      if (!block) { closeDialog(); return; }
      block.motion = simulateConversion(block, d.density);
      block.duration = block.motion.durationSeconds;
      state.dialog = null;
      state.selectedId = d.blockId;
      state.expandedId = d.blockId;
      state.selectedKf = null;
      state.selectedParam = block.motion.tracks[0]?.parameterId ?? state.selectedParam;
      state.view = 'graph';
      renderAll();
      toast('已转为自定义动作，可在时间轴上展开编辑', 'success');
    }, 900);
  });
}

/* ─────────── 播放头交互 ─────────── */
function seekFromEvent(clientX) {
  const canvas = $('#ruler-canvas');
  const rect = canvas.getBoundingClientRect();
  const t = (clientX - rect.left) / state.pps;
  state.playhead = clamp(t, 0, SCENE_DURATION);
}

function initRulerInteraction() {
  const ruler = $('#ruler');
  let dragging = false;
  ruler.addEventListener('pointerdown', (e) => {
    dragging = true;
    seekFromEvent(e.clientX);
    renderAll();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    seekFromEvent(e.clientX);
    renderAll();
  });
  window.addEventListener('pointerup', () => { dragging = false; });

  const hscroll = $('#timeline-hscroll');
  hscroll.addEventListener('scroll', () => {
    const offset = hscroll.scrollLeft;
    $('#ruler-canvas').style.transform = `translateX(${-offset}px)`;
  });
}

/* ─────────── 播放 ─────────── */
let rafId = null;
function playLoop() {
  if (!state.playing) return;
  state.playhead += 1 / 60;
  if (state.playhead > SCENE_DURATION) state.playhead = 0;
  renderPlayhead();
  rafId = requestAnimationFrame(playLoop);
}

function togglePlay() {
  state.playing = !state.playing;
  if (state.playing) {
    if (state.playhead >= SCENE_DURATION) state.playhead = 0;
    playLoop();
  } else if (rafId) {
    cancelAnimationFrame(rafId);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    togglePlay();
  }
  if (e.key === 'Escape') {
    if (state.dialog) closeDialog();
    else if (state.notesOpen) { state.notesOpen = false; renderNotes(); }
    else closeBlockMenu();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const motion = expandedMotion();
    if (!motion || state.selectedKf === null || state.view === 'list') return;
    const track = selectedTrack(motion);
    const idx = state.selectedKf;
    if (idx === 0 && Math.abs(track.keyframes[idx].time) < 0.001) {
      toast('首帧 (0.0s) 受保护，不能删除', 'error');
      return;
    }
    track.keyframes.splice(idx, 1);
    state.selectedKf = null;
    renderAll();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const motion = expandedMotion();
    if (!motion || state.selectedKf === null) return;
    e.preventDefault();
    jumpToKeyframe(motion, e.key === 'ArrowLeft' ? -1 : 1);
  }
});

  renderPlayhead();
  renderSelectionBar();

  renderDialog();

function bindEditorHeader() {
  const motion = expandedMotion();
  if (!motion) return;
  const durInput = $('#ed-duration');
  const fadeInput = $('#ed-fadein');
  if (durInput && !durInput.dataset.bound) {
    durInput.dataset.bound = '1';
    durInput.addEventListener('change', () => {
      const v = round2(clamp(Number(durInput.value) || 0.1, 0.1, SCENE_DURATION));
      if (v < motion.fadeInSeconds) { toast('时长不能短于淡入时长', 'error'); durInput.value = round2(motion.durationSeconds); return; }
      const block = findBlock(state.expandedId);
      motion.durationSeconds = v;
      block.duration = v;
      renderAll();
    });
  }
  if (fadeInput && !fadeInput.dataset.bound) {
    fadeInput.dataset.bound = '1';
    fadeInput.addEventListener('change', () => {
      const v = round2(clamp(Number(fadeInput.value) || 0, 0, motion.durationSeconds));
      motion.fadeInSeconds = v;
      renderAll();
    });
  }
  $$('.view-toggle button').forEach((btn) => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      state.selectedKf = null;
      renderAll();
    });
  });
}

  btn.addEventListener('click', () => { togglePlay(); renderAll(); });
  stage.appendChild(btn);
}

/* ─────────── 初始 ─────────── */
initTheme();
initRulerInteraction();
$('#btn-notes').addEventListener('click', () => { state.notesOpen = true; renderNotes(); });
renderAll();
</script>
